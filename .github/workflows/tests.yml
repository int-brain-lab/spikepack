name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests (without zarr)
        run: uv run pytest tests/ -v -m "not network" --cov=spikepack --cov-report=term-missing --cov-report=json

      - name: Run zarr tests
        run: uv run --extra zarr pytest tests/ -v -m "not network" -k zarr

      - name: Post coverage to step summary
        if: always()
        run: |
          python -c "
          import json, pathlib, os
          data = json.loads(pathlib.Path('coverage.json').read_text())
          t = data['totals']
          lines = [
            '## Coverage report',
            f\"| Statements | Covered | Missed | % |\",
            f\"|---|---|---|---|\",
            f\"| {t['num_statements']} | {t['covered_lines']} | {t['missing_lines']} | **{t['percent_covered']:.1f}%** |\",
          ]
          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary, 'a') as f:
            f.write('\n'.join(lines) + '\n')
          "
