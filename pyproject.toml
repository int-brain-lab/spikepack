[project]
name = "spikepack"
version = "0.1.0"
description = "Spike-train codec — lossless-order delta-quantization compression for sorted spike/event times"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The International Brain Laboratory" }]
dependencies = [
    "numpy",
    "numcodecs",
]

[project.optional-dependencies]
zarr = ["zarr>=3.0"]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/oliche/spikepack"
"Bug Tracker" = "https://github.com/oliche/spikepack/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spikepack"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires live ONE/Alyx access and downloads real data (deselect with -m 'not network')",
]

[dependency-groups]
dev = [
    "griffe<2.0",
    "pytest>=9.1.0",
    "pytest-cov>=5.0",
    "quartodoc>=0.7.0",
    "ruff>=0.4.0",
]

[tool.coverage.run]
source = ["spikepack"]
omit = []

[tool.coverage.report]
show_missing = true
